worker_processes  1;

error_log  /var/log/nginx/error.log;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log        /var/log/nginx/access.log;
    sendfile          on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  localhost;

        # ---------------------------------------------------------------
        # /api/*  ->  Spring Boot backend (port 8080)
        #
        # The trailing slash on proxy_pass strips the /api prefix, so the
        # backend (whose controllers are mapped at /contacts) receives
        # /contacts, not /api/contacts.
        #
        #   /api/contacts?page=0&size=20  ->  http://localhost:8080/contacts?page=0&size=20
        # ---------------------------------------------------------------
        location /api/ {
            proxy_pass http://localhost:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------
        # Everything else  ->  Vue frontend (Vite dev server, port 5173)
        #
        # Host is normalised to "localhost" so Vite's dev-server host check
        # accepts any hostname used to reach this single public NGINX origin.
        # ---------------------------------------------------------------
        location / {
            proxy_pass http://localhost:5173;
            proxy_http_version 1.1;
            proxy_set_header Host              localhost;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass WebSocket Upgrade headers so Vite hot-reload works through the proxy.
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}